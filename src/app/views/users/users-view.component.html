<div style="background-color: var(--surface-e); min-height: 100%;">

			<div class="flex m-0 mt-2 p-0 w-100">
				<button type="button" class="p-button-outlined p-button-raised p-button-danger my-1 mx-auto" label="Resetear Contraseña" pButton pRipple (click)="resetPassword($event)" [disabled]="isDisable"></button>
			</div>
		</p-tabPanel>
		<p-tabPanel header="Permisos" leftIcon="pi pi-bell">
			Content 2
		</p-tabPanel>
		<p-tabPanel header="Configuraciones" leftIcon="pi pi-bell">
			Content 2
		</p-tabPanel>
	</p-tabView>
</div>
