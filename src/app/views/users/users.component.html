<app-grid #grid
	[cols]="cols"
	[endpoint]="endpoint"
	header="Lista de Usuarios"
	[mapper]="mapper"
	[globalFilter]="globalFilter"
	[includes]="includes"
	(showClick)="show($event)"
	(addClick)="add()"
	(editClick)="edit($event)"
	(deleteClick)="delete($event)"></app-grid>

<app-modal #modal></app-modal>
