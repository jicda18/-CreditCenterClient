<app-grid #grid
	[cols]="cols"
	[endpoint]="endpoint"
	header="Lista de Monedas"
	[mapper]="mapper"
	[globalFilter]="globalFilter"
	[show]="false"
	[add]="canInsert"
	[edit]="canEdit"
	[delete]="canDelete"
	(addClick)="add()"
	(editClick)="edit($event)"
	(deleteClick)="delete($event)"></app-grid>

<app-modal #modal></app-modal>
