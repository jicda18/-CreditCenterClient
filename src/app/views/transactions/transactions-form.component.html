<div class="p-grid m-0 p-0">
	<form [formGroup]="form" (ngSubmit)="submit()">
		<!-- Banco -->
		<div class="flex my-1">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="fa fa-university"></i>
					<p-dropdown [options]="bankOptions" [class]="bank_keyInvalid ? 'ng-invalid ng-dirty' : ''" styleClass="w-100" [filter]="true" filterBy="label" formControlName="bank_key" optionLabel="label" optionValue="value" placeholder="Banco">
						<ng-template let-option pTemplate="item">
							<span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
						</ng-template>
					</p-dropdown>
					<label for="float-input">Banco*</label>
				</span>

				<small class="p-error" *ngIf="bank_keyInvalid">Banco es requerido.</small>
			</div>
		</div>

		<!-- Tipo -->
		<div class="flex my-1">
			<div class="col">
				<label for="float-input" class="mx-2">Tipo*: </label>
				<p-radioButton [styleClass]="'mx-2' + (typeInvalid ? ' ng-invalid ng-dirty' : '')" name="type" [value]="1" label="Deposito" formControlName="type"></p-radioButton>
				<p-radioButton [styleClass]="'mx-2' + (typeInvalid ? ' ng-invalid ng-dirty' : '')" name="type" [value]="-1" label="Retiro" formControlName="type"></p-radioButton>

				<small class="p-error" *ngIf="typeInvalid">Tipo es requerido.</small>
			</div>
		</div>

		<!-- Monto -->
		<div class="flex my-1">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="far fa-money-bill-alt"></i>
					<p-inputNumber [class]="'w-100' + (amountInvalid ? ' ng-invalid ng-dirty' : '')" styleClass="w-100" formControlName="amount" [showButtons]="true" [minFractionDigits]="2" [min]="0"></p-inputNumber>
					<label for="float-input">Monto*</label>
				</span>

				<small class="p-error" *ngIf="amountInvalid">Monto es requerido.</small>
			</div>
		</div>

		<!-- Comentario -->
		<div class="flex my-1">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="fas fa-comment"></i>
					<textarea type="text" [class]="'w-100' + (commentsInvalid ? ' ng-invalid ng-dirty' : '')" formControlName="comments" [autoResize]="true" pInputTextarea></textarea>
					<label for="float-input">Comentario*</label>
				</span>

				<small class="p-error" *ngIf="commentsInvalid">Comentario es requerido.</small>
			</div>
		</div>

		<p-progressBar mode="indeterminate" class="progressbar-success my-3 p-0 mb-0" *ngIf="loading"></p-progressBar>

		<div class="flex m-0 mt-2 p-0 w-100" *ngIf="!loading">
			<button type="submit" class="p-button-outlined p-button-raised p-button-success my-1 ml-auto mr-1" label="Guardar" pButton pRipple></button>
		</div>
	</form>
</div>
