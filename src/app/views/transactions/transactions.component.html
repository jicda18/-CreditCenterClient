<div class="p-grid m-0 p-0" style="background-color: var(--surface-e); min-height: 100%;">
	<form [formGroup]="form" (ngSubmit)="submit()">
		<div class="flex my-1 w-100">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="fa fa-university z-index-100"></i>

					<p-dropdown [options]="actionOptions" [styleClass]="'w-100' + (actionInvalid ? ' ng-invalid ng-dirty' : '')" [filter]="false" formControlName="action" optionLabel="label" optionValue="value" placeholder="Tipo">
						<ng-template let-option pTemplate="item">
							<span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
						</ng-template>
					</p-dropdown>
					<label for="float-input">Tipo*</label>
				</span>

				<small class="p-error" *ngIf="actionInvalid">Tipo es requerido.</small>
			</div>
		</div>

		<div class="flex my-1 w-100">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="fa fa-university z-index-100"></i>

					<p-dropdown [options]="bankOptions" [styleClass]="'w-100' + (bankInvalid ? ' ng-invalid ng-dirty' : '')" [filter]="false" formControlName="bank" optionLabel="label" optionValue="value" placeholder="Banco">
						<ng-template let-option pTemplate="item">
							<span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
						</ng-template>
					</p-dropdown>
					<label for="float-input">Banco*</label>
				</span>

				<small class="p-error" *ngIf="bankInvalid">Banco es requerido.</small>
			</div>
		</div>

		<div class="flex my-1 w-100">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="fa fa-university z-index-100"></i>

					<p-dropdown [options]="debtorOptions" [styleClass]="'w-100' + (debtorInvalid ? ' ng-invalid ng-dirty' : '')" [filter]="false" formControlName="debtor" optionLabel="label" optionValue="value" placeholder="Cliente">
						<ng-template let-option pTemplate="item">
							<span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
						</ng-template>
					</p-dropdown>
					<label for="float-input">Cliente*</label>
				</span>

				<small class="p-error" *ngIf="debtorInvalid">Cliente es requerido.</small>
			</div>
		</div>

		<div class="flex my-1 w-100">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="fa fa-university z-index-100"></i>

					<p-dropdown [options]="currencyOptions" [styleClass]="'w-100' + (currencyInvalid ? ' ng-invalid ng-dirty' : '')" [filter]="false" formControlName="currency" optionLabel="label" optionValue="value" placeholder="Moneda">
						<ng-template let-option pTemplate="item">
							<span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
						</ng-template>
					</p-dropdown>
					<label for="float-input">Moneda*</label>
				</span>

				<small class="p-error" *ngIf="currencyInvalid">Moneda es requerido.</small>
			</div>
		</div>

		<div class="flex my-1">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="fa fa-university z-index-100"></i>
					<p-inputNumber class="w-100" styleClass="w-100" [inputStyleClass]="(incomeInvalid ? 'ng-invalid ng-dirty' : '')" formControlName="income" [showButtons]="true" [minFractionDigits]="2" [min]="1"></p-inputNumber>
					<label for="float-input">Monto*</label>
				</span>

				<small class="p-error" *ngIf="incomeInvalid">Monto es requerido.</small>
			</div>
		</div>

		<div class="flex my-1">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="fa fa-university z-index-100"></i>
					<textarea type="text" [class]="'w-100' + (commentInvalid ? ' ng-invalid ng-dirty' : '')" formControlName="comment" [autoResize]="true" pInputTextarea></textarea>
					<label for="float-input">Comentario*</label>
				</span>

				<small class="p-error" *ngIf="commentInvalid">Comentario es requerido.</small>
			</div>
		</div>

		<p-progressBar mode="indeterminate" class="progressbar-warning my-3 p-0 mb-0" *ngIf="loading"></p-progressBar>

		<div class="flex m-0 mt-2 p-0 w-100" *ngIf="!loading">
			<button type="submit" class="p-button-outlined p-button-raised p-button-warning my-1 mx-auto" label="Guardar" pButton pRipple></button>
		</div>
	</form>
</div>
