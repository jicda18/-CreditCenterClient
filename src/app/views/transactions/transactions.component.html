<div class="p-grid m-0 p-0" style="background-color: var(--surface-e); min-height: 100%;">
	<form [formGroup]="form" (ngSubmit)="submit()">
		<div class="flex my-1 w-100">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="fa fa-university"></i>

					<p-dropdown [options]="actionOptions" styleClass="w-100" [filter]="false" optionLabel="label" optionValue="value" placeholder="Tipo">
						<ng-template let-option pTemplate="item">
							<span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
						</ng-template>
					</p-dropdown>
					<label for="float-input">Tipo*</label>
				</span>
			</div>
		</div>

		<div class="flex my-1 w-100">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="fa fa-university"></i>

					<p-dropdown [options]="actionOptions" styleClass="w-100" [filter]="false" optionLabel="label" optionValue="value" placeholder="Banco">
						<ng-template let-option pTemplate="item">
							<span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
						</ng-template>
					</p-dropdown>
					<label for="float-input">Banco*</label>
				</span>
			</div>
		</div>

		<div class="flex my-1 w-100">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="fa fa-university"></i>

					<p-dropdown [options]="actionOptions" styleClass="w-100" [filter]="false" optionLabel="label" optionValue="value" placeholder="Cliente">
						<ng-template let-option pTemplate="item">
							<span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
						</ng-template>
					</p-dropdown>
					<label for="float-input">Cliente*</label>
				</span>
			</div>
		</div>

		<div class="flex my-1">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="fa fa-university"></i>
					<p-inputNumber [styleClass]="'w-100' + (incomeInvalid ? ' ng-invalid ng-dirty' : '')" formControlName="income" [showButtons]="true" [minFractionDigits]="2" [min]="0"></p-inputNumber>
					<label for="float-input">Monto*</label>
				</span>

				<small class="p-error" *ngIf="incomeInvalid">Monto es requerido.</small>
			</div>
		</div>

		<p-progressBar mode="indeterminate" class="progressbar-warning my-3 p-0 mb-0" *ngIf="loading"></p-progressBar>

		<div class="flex m-0 mt-2 p-0 w-100" *ngIf="!loading">
			<button type="submit" class="p-button-outlined p-button-raised p-button-warning my-1 mx-auto" label="Guardar" pButton pRipple></button>
		</div>
	</form>
</div>
