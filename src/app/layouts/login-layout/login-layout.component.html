<div class="main-box p-0">
	<div style="height: 92px;"></div>

	<div class="p-grid m-0 p-0">
		<div class="p-col-12 p-col-sm-10 p-col-md-8 mx-auto login-box">
			<div class="flex">
				<div class="p-col">
					<img [src]="logo" alt="logo.png" style="width: 100%;">
				</div>
			</div>
			<div class="flex">
				<div class="col">
					<h3 class="text-primary login-subtitle mt-0">Login a {{name}}</h3>
				</div>
			</div>

			<form [formGroup]="form" (ngSubmit)="authenticate()">
				<div class="flex">
					<div class="col">

						<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
							<i class="pi pi-user"></i>
							<input type="text" [class]="'w-100' + (usernameInvalid ? ' ng-invalid ng-dirty' : '')" formControlName="username" pInputText>
							<label for="float-input">Usuario</label>
						</span>

						<small class="p-error" *ngIf="usernameInvalid">El Usuario es requerido.</small>
					</div>
				</div>

				<div class="flex mt-1">
					<div class="col">
						<span class="p-float-label p-input-icon-left p-input-icon-right mb-0 mt-1" style="width: 100%;">
							<i class="pi pi-lock"></i>
							<input [type]="show ? 'text' : 'password'" [class]="'w-100' + (passwordInvalid ? ' ng-invalid ng-dirty' : '')" type="text" formControlName="password" pInputText>
							<label for="float-input">Usuario</label>
							<i [ngClass]="{'pi ': true, 'pi-eye' : !show , 'pi-eye-slash' : show}" (click)="show = !show" style="cursor: pointer;"></i>
						</span>

						<small class="p-error" *ngIf="passwordInvalid">La Contraseña es requerida.</small>
					</div>
				</div>

				<p-progressBar mode="indeterminate" class="progressbar-warning my-3 p-0 mb-0" *ngIf="loading"></p-progressBar>

				<div class="flex m-0 mt-2 p-0" *ngIf="!loading">
					<button type="submit" class="p-button-outlined p-button-raised p-button-warning mt-1 mb-0 w-100" label="Iniciar" pButton pRipple></button>
				</div>
			</form>

			<div class="flex my-0">
				<button pButton pRipple type="button" label="¿Olvido su contraseña?" class="p-button-info p-button-text ml-auto mr-0 pr-0"></button>
			</div>
		</div>
	</div>
</div>

<p-toast position="top-right"></p-toast>
