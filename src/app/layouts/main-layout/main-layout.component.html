<div class="w-100 main-box p-0 m-0">
	<p-toolbar styleClass="bg-white">
		<div class="p-toolbar-group-left">
			<a class="navbar-brand" ng-reflect-router-link="/" href="#/">
				<img [src]="logo" height="50" alt="Logo" class="navbar-brand-full">
			</a>

			<button pButton pRipple type="button" icon="fas fa-bars" class="p-button-rounded p-button-primary p-button-text toggler-icon" (click)="visibleSidebar = !visibleSidebar"></button>
		</div>

		<div class="p-toolbar-group-right">
			<p-avatar [image]="image" styleClass="mr-2" size="large" shape="circle"></p-avatar>

			<!-- Todo: use notification count to badge-->
			<h2 class="text-primary cursor-pointer m-0" pBadge [value]="badgeCount.toString()" (click)="menuToggle.click()">{{ name }}</h2>

			<i #menuToggle class="pi pi-angle-down px-2 text-primary cursor-pointer" style="font-size: 1.5em;" (click)="menu.toggle($event)"></i>

			<p-tieredMenu #menu [model]="items" [popup]="true"></p-tieredMenu>
		</div>
	</p-toolbar>

	<div class="display-area flex">
		<!-- sidebar -->
		<div #sidebarArea class="col p-0 sidebar-area">
			<p-sidebar [appendTo]="sidebarArea" [(visible)]="visibleSidebar" position="left" styleClass="p-sidebar-sm p-sidebar-inline p-0" [modal]="false" [dismissible]="false" [closeOnEscape]="false" [showCloseIcon]="false">
				<p-tieredMenu [model]="navs ?? []" styleClass="w-100 p-0"></p-tieredMenu>
			</p-sidebar>
		</div>

		<!-- view render -->
		<div class="col m-0 p-0 bg-ghost-white view-area">
			<router-outlet></router-outlet>
		</div>
	</div>
</div>

<p-toast position="top-right"></p-toast>
