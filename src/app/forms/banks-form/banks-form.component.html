<div class="p-grid m-0 p-0">
	<form [formGroup]="form" (ngSubmit)="submit()">
		<div class="flex my-1">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="fa fa-university"></i>
					<input type="text" [class]="'w-100' + (nameInvalid ? ' ng-invalid ng-dirty' : '')" formControlName="name" pInputText>
					<label for="float-input">Nombre*</label>
				</span>

				<small class="p-error" *ngIf="nameInvalid">Nombre es requerido.</small>
			</div>
		</div>

		<div class="flex my-1">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="pi pi-money-bill"></i>
					<p-dropdown [options]="currencyOptions" [styleClass]="'w-100' + (currencyKeyInvalid ? ' ng-invalid ng-dirty' : '')" [filter]="true" filterBy="label" [showClear]="true" formControlName="currency_key" optionLabel="label" optionValue="value" placeholder="Moneda">
						<ng-template let-option pTemplate="item">
							<span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
						</ng-template>
					</p-dropdown>
					<label for="float-input">Moneda*</label>
				</span>

				<small class="p-error" *ngIf="currencyKeyInvalid">Moneda es requerido.</small>
			</div>
		</div>

		<div class="flex my-1">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="pi pi-tag"></i>
					<input type="text" [class]="'w-100' + (nicknameInvalid ? ' ng-invalid ng-dirty' : '')" formControlName="nickname" pInputText>
					<label for="float-input">Apodo*</label>
				</span>

				<small class="p-error" *ngIf="nameInvalid">Apodo es requerido.</small>
			</div>
		</div>

		<div class="flex my-1">
			<div class="col">
				<span class="p-float-label p-input-icon-left mb-0 mt-1" style="width: 100%;">
					<i class="pi pi-id-card"></i>
					<input type="text" [class]="'w-100' + (accountInvalid ? ' ng-invalid ng-dirty' : '')" formControlName="account" pInputText>
					<label for="float-input">Cuenta*</label>
				</span>

				<small class="p-error" *ngIf="accountInvalid">Cuenta es requerido.</small>
			</div>
		</div>

		<p-progressBar mode="indeterminate" class="progressbar-warning my-3 p-0 mb-0" *ngIf="loading"></p-progressBar>

		<div class="flex m-0 mt-2 p-0 w-100" *ngIf="!loading">
			<button type="button" class="p-button-outlined p-button-raised p-button-warning my-1 mx-auto" label="Cancelar" pButton pRipple (click)="cancel.emit()"></button>
			<button type="submit" class="p-button-outlined p-button-raised p-button-warning my-1 mx-auto" label="Guardar" pButton pRipple></button>
		</div>
	</form>
</div>
