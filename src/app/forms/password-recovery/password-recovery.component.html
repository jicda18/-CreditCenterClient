<div class="p-grid m-0 p-0">
	<form [formGroup]="form" (ngSubmit)="submit()">
		<!-- username -->
		<div class="flex mt-1" *ngIf="request === undefined">
			<div class="col">
				<span class="p-float-label p-input-icon-left p-input-icon-right mb-0 mt-1" style="width: 100%;">
					<i class="fas fa-user"></i>
					<input type="text" [class]="'w-100' + (usernameInvalid ? ' ng-invalid ng-dirty' : '')" type="text" formControlName="username" pInputText>
					<label for="float-input">Usuario o Email</label>
				</span>

				<small class="p-error" *ngIf="usernameInvalid">Usuario o Email es requerida.</small>
			</div>
		</div>

		<!-- code -->
		<div class="flex mt-1" *ngIf="request !== undefined">
			Codigo enviado a su correo {{request.email}}
		</div>

		<div class="flex mt-1" *ngIf="request !== undefined">
			<div class="col">
				<span class="p-float-label p-input-icon-left p-input-icon-right mb-0 mt-1" style="width: 100%;">
					<i class="fas fa-key"></i>
					<p-inputMask [styleClass]="'w-100 as-enable' + (codeInvalid ? ' ng-invalid ng-dirty' : '')" formControlName="code" mask="9999 9999"></p-inputMask>
					<label for="float-input">Codigo</label>
				</span>

				<small class="p-error" *ngIf="codeInvalid">Codigo.</small>
			</div>
		</div>

		<!-- pass -->
		<div class="flex mt-1" *ngIf="request !== undefined">
			<div class="col">
				<span class="p-float-label p-input-icon-left p-input-icon-right mb-0 mt-1" style="width: 100%;">
					<i class="pi pi-lock"></i>
					<input [type]="show.new ? 'text' : 'password'" [class]="'w-100' + (passInvalid ? ' ng-invalid ng-dirty' : '')" type="text" formControlName="pass" pInputText (change)="rptValidate()">
					<label for="float-input">Contraseña Nueva</label>
					<i [ngClass]="{'pi ': true, 'pi-eye' : !show.new , 'pi-eye-slash' : show.new}" (click)="show.new = !show.new" style="cursor: pointer;"></i>
				</span>

				<small class="p-error" *ngIf="passInvalid">La contraseña nueva es requerida.</small>
			</div>
		</div>

		<!-- repeat pass -->
		<div class="flex mt-1" *ngIf="request !== undefined">
			<div class="col">
				<span class="p-float-label p-input-icon-left p-input-icon-right mb-0 mt-1" style="width: 100%;">
					<i class="pi pi-lock"></i>
					<input [type]="show.rpt ? 'text' : 'password'" [class]="'w-100' + (rptInvalid ? ' ng-invalid ng-dirty' : '')" type="text" formControlName="rpt" pInputText (change)="rptValidate()">
					<label for="float-input">Repetir Contraseña Nueva</label>
					<i [ngClass]="{'pi ': true, 'pi-eye' : !show.rpt , 'pi-eye-slash' : show.rpt}" (click)="show.rpt = !show.rpt" style="cursor: pointer;"></i>
				</span>

				<small class="p-error" *ngIf="rptInvalid && rptErrors.required">El repetir contraseña nueva es requerido.</small>
				<small class="p-error" *ngIf="rptInvalid && rptErrors.different">La contraseña no coinciden.</small>
			</div>
		</div>

		<p-progressBar mode="indeterminate" class="progressbar-success my-3 p-0 mb-0" *ngIf="loading"></p-progressBar>

		<div class="flex m-0 mt-2 p-0 w-100" *ngIf="!loading">
			<button type="button" class="p-button-outlined p-button-raised p-button-danger my-1 mx-auto" label="Cancelar" pButton pRipple (click)="cancel()"></button>
			<button type="submit" class="p-button-outlined p-button-raised p-button-success my-1 mx-auto" label="Cambiar" pButton pRipple></button>
		</div>
	</form>
</div>
