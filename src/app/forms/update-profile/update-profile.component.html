<div class="p-grid m-0 p-0">
	<form [formGroup]="form" (ngSubmit)="submit()">
		<!-- name -->
		<div class="flex mt-1">
			<div class="col">
				<span class="p-float-label p-input-icon-left p-input-icon-right mb-0 mt-1" style="width: 100%;">
					<i class="fas fa-user"></i>
					<input type="text" [class]="'w-100' + (nameInvalid ? ' ng-invalid ng-dirty' : '')" type="text" formControlName="name" pInputText>
					<label for="float-input">Nombre</label>
				</span>

				<small class="p-error" *ngIf="nameInvalid">El nombre es requerida.</small>
			</div>
		</div>

		<!-- mail -->
		<div class="flex mt-1">
			<div class="col">
				<span class="p-float-label p-input-icon-left p-input-icon-right mb-0 mt-1" style="width: 100%;">
					<i class="fas fa-at"></i>
					<input type="email" [class]="'w-100' + (mailInvalid ? ' ng-invalid ng-dirty' : '')" type="text" formControlName="mail" pInputText>
					<label for="float-input">Email</label>
				</span>

				<small class="p-error" *ngIf="mailInvalid">El email es requerida.</small>
			</div>
		</div>

		<!-- avatar -->
		<div class="flex mt-1">
			<div class="col">
				<p-fileUpload mode="advanced" [showUploadButton]="false" accept="image/png,image/jpeg" chooseLabel="Avatar" (onSelect)="files = $event.currentFiles" (onClear)="files = undefined" (onRemove)="files = undefined"></p-fileUpload>
			</div>
		</div>

		<p-progressBar mode="indeterminate" class="progressbar-success my-3 p-0 mb-0" *ngIf="loading"></p-progressBar>

		<div class="flex m-0 mt-2 p-0 w-100" *ngIf="!loading">
			<button type="button" class="p-button-outlined p-button-raised p-button-danger my-1 mx-auto" label="Cancelar" pButton pRipple (click)="cancel()"></button>
			<button type="submit" class="p-button-outlined p-button-raised p-button-success my-1 mx-auto" label="Cambiar" pButton pRipple></button>
		</div>
	</form>
</div>
