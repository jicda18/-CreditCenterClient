<div class="flex">
	<p-table #dt [columns]="cols" [value]="data" dataKey="key" class="mx-auto">
		<ng-template pTemplate="caption">
			<div class="flex">
				<button type="button" pButton pRipple icon="pi pi-file" (click)="dt.exportCSV()" class="mr-2" pTooltip="CSV" tooltipPosition="bottom"></button>
				<button type="button" pButton pRipple icon="pi pi-file-excel" (click)="exportAsExcel()" class="p-button-success mr-2" pTooltip="XLS" tooltipPosition="bottom"></button>
				<!-- <button type="button" pButton pRipple icon="pi pi-file-pdf" (click)="exportPdf()" class="p-button-warning mr-2" pTooltip="PDF" tooltipPosition="bottom"></button> -->
				<!-- <button type="button" pButton pRipple icon="pi pi-filter" (click)="dt.exportCSV({selectionOnly:true})" class="p-button-info ml-auto" pTooltip="Selection Only" tooltipPosition="bottom"></button> -->
			</div>
		</ng-template>

		<ng-template pTemplate="header" let-columns>
			<tr>
				<th class="text-center px-3" *ngFor="let column of columns">
					{{column.header}}
				</th>
			</tr>
		</ng-template>

		<ng-template pTemplate="body" let-transaction>
			<tr>
				<td class="text-center px-2">{{transaction.was_at}}</td>
				<td class="text-center px-2">{{transaction.amount}}</td>
				<td class="text-center px-2">{{transaction.balance}}</td>
				<td class="text-center px-2">{{transaction.register}}</td>
				<td class="text-center px-2">{{transaction.inserted_at}}</td>
				<td class="text-center px-2">{{transaction.comment}}</td>
			</tr>
		</ng-template>
	</p-table>
</div>
