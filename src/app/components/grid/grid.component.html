<div class="p-3" style="overflow-x: auto;">
	<h2 class="text-primary sticky-left">{{ header }}</h2>
	<p-table #dt [value]="data" [lazy]="true" (onLazyLoad)="load($event)" [paginator]="true" [rows]="rows"
		[totalRecords]="totalRecords" [loading]="loading" [dataKey]="idKey" [rowsPerPageOptions]="rowsPerPageOptions"
		currentPageReportTemplate="{first} - {last} de {totalRecords}" [filterDelay]="500" [sortField]="idKey"
		responsiveLayout="scroll">

		<ng-template pTemplate="caption">
			<div class="table-header">
				<div class="flex sticky-left" [ngStyle]="{'width': width}">
					<button pButton class="p-button-outlined p-button-success mx-2" icon="pi pi-plus" (click)="addClick.emit()" *ngIf="add"></button>

					<button pButton class="p-button-outlined p-button-primary ml-2 mr-auto" icon="pi pi-filter-slash" (click)="dt.clear()" *ngIf="filter"></button>

					<span class="p-input-icon-left ml-auto mr-2" *ngIf="filter && globalFilter !== undefined">
						<i class="pi pi-search" style="color: var(--surface-100);"></i>
						<input #search pInputText type="text" (input)="dt.filterGlobal(search.value, 'contains')" placeholder="Buscar" />
					</span>
				</div>
			</div>
		</ng-template>

		<ng-template pTemplate="header">
			<tr>
				<th *ngIf="show || edit || delete"></th>

				<th *ngFor="let col of cols" [pSortableColumn]="col.key">
					{{ col.label }}
					<p-sortIcon [field]="col.key" *ngIf="!col.disableSort"></p-sortIcon>
					<p-columnFilter #filter [type]="col.type" [field]="col.key" display="menu" class="p-ml-auto" *ngIf="filter && col.filter" [showApplyButton]="!col.enableOptions" [showMatchModes]="!col.enableOptions" matchMode="equals" [showAddButton]="false" [showOperator]="false" [minFractionDigits]="col.minFractionDigits ?? 0" [prefix]="col.prefix ?? ''" [suffix]="col.suffix ?? ''">
						<ng-template pTemplate="filter" let-value let-filter="filterCallback" *ngIf="col.enableOptions">
							<p-dropdown [ngModel]="value" [options]="col.options ?? []" (onChange)="filter($event.value)" placeholder="Cualquiera" optionLabel="label" optionValue="value">
								<ng-template let-option pTemplate="item">
									<span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
								</ng-template>
							</p-dropdown>
						</ng-template>
					</p-columnFilter>
			</tr>
		</ng-template>

		<ng-template pTemplate="body" let-item>
			<tr>
				<td *ngIf="show || edit || delete">
					<button pButton class="p-button-outlined p-button-rounded p-button-info m-1" icon="pi pi-eye" (click)="showClick.emit(item.original)" *ngIf="show"></button>

					<button pButton class="p-button-outlined p-button-rounded p-button-warning m-1" icon="pi pi-pencil" (click)="editClick.emit(item.original)" *ngIf="edit"></button>

					<button pButton class="p-button-outlined p-button-rounded p-button-danger m-1" icon="pi pi-trash" (click)="deleteClickFunction(item.original, $event)" *ngIf="delete"></button>
				</td>

				<td *ngFor="let col of cols">
					<p-avatar [image]="item[col.key]" size="xlarge" shape="square" *ngIf="col.image"></p-avatar>

					<div class="col" *ngIf="!col.image && col.type !== 'boolean'">{{item[col.key]}}</div>

					<p-triStateCheckbox [ngModel]="item[col.key]" [readonly]="true" *ngIf="!col.image && col.type === 'boolean'" [styleClass]="item[col.key] ? 'p-checkbox-true' : 'p-checkbox-false'"></p-triStateCheckbox>
				</td>
			</tr>
		</ng-template>

		<ng-template pTemplate="emptymessage">
			<tr>
				<td [attr.colspan]="cols.length + (show || edit || delete ? 1 : 0)">No se encontró ningún resultado.</td>
			</tr>
		</ng-template>


		<ng-template pTemplate="paginatorleft" let-state>

		</ng-template>

		<ng-template pTemplate="paginatorright" let-state>
			{{state.first + 1}} - {{(state.first + state.rows < state.totalRecords ? (state.first + state.rows) : state.totalRecords)}} de {{state.totalRecords}}
		</ng-template>
	</p-table>
</div>

<p-confirmPopup></p-confirmPopup>
